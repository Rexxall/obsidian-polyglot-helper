<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Polyglot Helper</title>
  <desc id="d">Polyglot Helper：在句子旁边弹出 蔵書（ぞうしょ，藏书）的词卡，可以加入生词本；存过的词在阅读时会加下划线。</desc>
  <rect width="1200" height="400" rx="28" fill="#15141B"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'PingFang SC', sans-serif">
    <text x="64" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#A48BFF">OBSIDIAN 插件 · 英语和日语</text>
    <text x="62" y="196" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#EEECF5">Polyglot Helper</text>
    <text x="64" y="252" font-size="29" fill="#EEECF5">在读的地方查词，</text>
    <text x="64" y="292" font-size="29" fill="#9C98AF">存下来，下次读到还认得。</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9C98AF">免费词典 · 不用注册 · 可送进 Anki</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'PingFang SC', sans-serif">
    <rect x="700" y="48" width="436" height="304" rx="20" fill="#1E1D26" stroke="#2C2A36"/>
    <text x="728" y="98" font-size="22" fill="#EEECF5">月の予定で、<tspan font-weight="600">蔵書</tspan>は約十二万冊。</text>
    <rect x="861" y="106" width="44" height="3" rx="1.5" fill="#6E5BB8"/>
    <rect x="724" y="128" width="388" height="200" rx="16" fill="#15141B" stroke="#2C2A36"/>
    <text x="748" y="178" font-size="34" font-weight="700" fill="#EEECF5">蔵書</text>
    <text x="830" y="176" font-size="18" fill="#9C98AF">ぞうしょ</text>
    <circle cx="930" cy="169" r="14" fill="#2C2643"/>
    <path d="M926 162 L926 176 L937 169 Z" fill="#A48BFF"/>
    <text x="748" y="224" font-size="19" fill="#EEECF5">collection of books; (personal) library</text>
    <rect x="748" y="244" width="340" height="1" fill="#2C2A36"/>
    <rect x="748" y="262" width="168" height="40" rx="20" fill="#A48BFF"/>
    <text x="832" y="288" font-size="17" font-weight="600" text-anchor="middle" fill="#FFFFFF">Add to word list</text>
    <text x="1088" y="288" font-size="15" text-anchor="end" fill="#9C98AF">Jisho</text>
  </g>
</svg>
