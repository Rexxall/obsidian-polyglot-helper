name: Release

# Pushing a tag such as 1.9.1 builds the plugin from that tag, attests the three files and
# publishes them as the release. The tag must match the version in manifest.json, package.json,
# package-lock.json and versions.json, and must be on main.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag and versions
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version tag: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")" ]]; then
            echo "Checked-out commit is not tag $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $RELEASE_VERSION is not on main" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # the single-quoted script is JavaScript, not shell
          node -e '
            const tag = process.env.RELEASE_VERSION;
            const manifest = require("./manifest.json");
            const lock = require("./package-lock.json");
            const versions = require("./versions.json");
            const found = {
              "manifest.json": manifest.version,
              "package.json": require("./package.json").version,
              "package-lock.json": lock.version,
              "package-lock.json root": lock.packages?.[""]?.version,
            };
            for (const [file, version] of Object.entries(found)) {
              if (version !== tag) throw new Error(`${file} says ${version}, the tag is ${tag}`);
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error(`versions.json maps ${tag} to ${versions[tag]}, manifest.json needs ${manifest.minAppVersion}`);
            }
          '
          awk -v tag="$RELEASE_VERSION" '$0 == "## " tag {found=1; next} /^## /{found=0} found' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no section for $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Signed build provenance, as in Obsidian's example release workflow. Anyone can check a
      # download with: gh attestation verify main.js --repo Rexxall/obsidian-polyglot-helper
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --verify-tag --title "$RELEASE_VERSION" --notes-file release-notes.md
            gh release upload "$RELEASE_VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$RELEASE_VERSION" main.js manifest.json styles.css \
              --verify-tag --title "$RELEASE_VERSION" --notes-file release-notes.md
          fi
